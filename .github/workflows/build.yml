name: Build

on:
  workflow_call:
    inputs:
      suffix:
        type: string
        default: ""
      ref:
        type: string
        default: ""
      retention-days:
        type: number
        default: 14

jobs:
  linux:
    name: Build every package
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    outputs:
      url: ${{ steps.upload.outputs.artifact-url }}
      windows-url: ${{ steps.upload-windows.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install the C++ and Windows cross toolchains
        run: |
          need=""
          command -v cmake >/dev/null || need="$need cmake"
          command -v g++ >/dev/null || need="$need g++"
          command -v x86_64-w64-mingw32-g++-posix >/dev/null || need="$need mingw-w64"
          if [ -n "$need" ]; then
            sudo=""
            [ "$(id -u)" -eq 0 ] || sudo=sudo
            $sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive $sudo apt-get install -y -qq $need
          fi
      - run: python scripts/package.py --platform all --suffix="${{ inputs.suffix }}"
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-linux
          path: |
            dist/
            !dist/*-windows.*
          retention-days: ${{ inputs.retention-days }}
          overwrite: true
      - id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: keymaster-windows
          path: dist/*-windows.*
          if-no-files-found: ignore
          retention-days: ${{ inputs.retention-days }}
          overwrite: true
