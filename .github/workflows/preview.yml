name: Preview

on:
  pull_request:
    branches: [release]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: github.head_ref != 'changeset-release/release'
    uses: ./.github/workflows/build.yml
    with:
      suffix: -pr${{ github.event.number }}

  comment:
    name: Comment the downloads on the PR
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@v7
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- preview-builds -->'
            const body = `${marker}\nBuilds for this PR, from ${process.env.SHA.slice(0, 7)}: [download them from the run](${process.env.RUN}#artifacts) (kept 14 days). To test, download \`keymaster-installer-…-windows.exe\` from \`keymaster-windows\` or \`keymaster-installer-…-linux.sh\` from \`keymaster-linux\` and run it: it installs the core and the hosts you have. The per-package zips in the same artifacts are for advanced users.`
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const mine = comments.find((c) => c.body && c.body.startsWith(marker))
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body })
            else await github.rest.issues.createComment({ owner, repo, issue_number, body })
