name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      rc:
        description: Release candidate tag to promote, like v1.2.0-rc.2 (empty means the newest)
        type: string
        default: ""

concurrency: release

permissions:
  contents: write

jobs:
  promote:
    name: Version, tag and publish the release
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: python scripts/release.py promote --rc "$RC" --dist tmp/promote-dist
        env:
          RC: ${{ inputs.rc }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
