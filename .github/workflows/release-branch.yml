name: Release branch

on:
  push:
    branches: [release]

concurrency: release-branch

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      suffix: -staging.${{ github.run_number }}
      retention-days: 3

  staging:
    name: Publish the staging pre-release
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: keymaster-*
          path: dist
          merge-multiple: true
      - run: bash scripts/staging-release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
